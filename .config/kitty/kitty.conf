# Font
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font
italic_font JetBrainsMono Nerd Font
bold_italic_font JetBrainsMono Nerd Font
font_size 12.0

# Shell
shell /usr/bin/zsh

# Layout
window_padding_width 10
hide_window_decorations titlebar-only

# Tab bar
tab_bar_style powerline
tab_bar_edge bottom
tab_bar_background #181825
active_tab_foreground #cdd6f4
active_tab_background #313244
inactive_tab_foreground #a6adc8
inactive_tab_background #1e1e2e

# Cursor
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 5.0

# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 100

# Mouse
mouse_hide_wait 2.0
url_color #89b4fa
open_url_with_default_browser yes

# Performance
sync_to_monitor no

# Catppuccin Mocha colors
background #1e1e2e
foreground #cdd6f4
selection_background #f5e0dc
selection_foreground #1e1e2e

cursor #f5e0dc
cursor_text_color #1e1e2e

# Normal
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de

# Bright
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# Dim/UI accents
active_border_color #b4befe
inactive_border_color #585b70
bell_border_color #f9e2af
visual_bell_color #f9e2af
