# Hyprlock — Catppuccin Mocha, JetBrainsMono Nerd Font
# Animations and fades disabled (performance)

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    disable_loading_bar = true
    no_fade_in = true
    no_fade_out = true
    grace = 0
}

background {
    monitor =
    color = rgba(1e1e2eff)
    blur_passes = 0
    blur_size = 0
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 2
    rounding = 10
    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true

    inner_color = rgba(181825ff)
    outer_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    capslock_color = rgba(f9e2afff)

    placeholder_text = Password...
    fail_text = $PAMFAIL

    position = 0, -20%
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_family = $font
    font_size = 90
    color = rgba(cdd6f4ff)

    position = 0, 12%
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = $font
    font_size = 22
    color = rgba(bac2deff)

    position = 0, 24%
    halign = center
    valign = center
}

# User greeting
label {
    monitor =
    text = Hi, $USER
    font_family = $font
    font_size = 16
    color = rgba(89b4faff)

    position = 0, 33%
    halign = center
    valign = center
}

# Keyboard layout (click to cycle)
label {
    monitor =
    text = $LAYOUT
    font_family = $font
    font_size = 14
    color = rgba(6c7086ff)

    position = 0, -40%
    halign = center
    valign = center

    onclick = hyprctl switchxkblayout all next
}