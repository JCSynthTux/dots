# llama.cpp system config — shared defaults for every llama-server invocation.
# Precedence: this file < environment (LLAMA_ARG_*) < CLI flags < model presets.
# Requires a recent llama.cpp with system-config support (PR #26118); older builds
# silently ignore this file. Verify in the startup log after setup: the
# llama_kv_cache line should show K (q8_0) / V (q8_0), and all layers should be
# offloaded (offloaded 99/99). If not, your build is too old and the flags must
# move back into the llama-swap cmd blocks.
[*]
LLAMA_ARG_N_GPU_LAYERS = 99
LLAMA_ARG_FLASH_ATTN = auto
LLAMA_ARG_CACHE_TYPE_K = q8_0
LLAMA_ARG_CACHE_TYPE_V = q8_0
LLAMA_ARG_PARALLEL = 1
LLAMA_ARG_BATCH_SIZE = 1024
LLAMA_ARG_THREADS = 8
