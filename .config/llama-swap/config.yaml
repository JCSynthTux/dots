# llama-swap: dynamic load/unload proxy for llama-server.
# One model in VRAM at a time; a request whose `model` doesn't match the
# resident model triggers a hot-swap (kill + start the matching cmd).
# Listening address is set by the systemd unit's `--listen` flag.
healthCheckTimeout: 240

models:

  qwen-27b:
    cmd: >
      /usr/bin/llama-server
      --host 127.0.0.1
      --port ${PORT}
      --model /home/jchroback/.local/share/models/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --alias qwen-27b
      --jinja
      --ctx-size 65536
      --reasoning off
      --no-reasoning-preserve
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0.0
    ttl: 1800

  # Thinking sibling of qwen-27b: same GGUF, different flags. llama-swap still
  # keeps exactly one resident, so switching orchestrator -> coder reloads the
  # same weights (~10-30 s from page cache). "high" maps to "xhigh" in this
  # chat template; use "medium" if xhigh turns are too slow.
  qwen-27b-think:
    cmd: >
      /usr/bin/llama-server
      --host 127.0.0.1
      --port ${PORT}
      --model /home/jchroback/.local/share/models/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --alias qwen-27b-think
      --jinja
      --ctx-size 65536
      --reasoning on
      --reasoning-format deepseek
      --reasoning-effort high
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
    ttl: 1800

  qwen-heretic-8b:
    cmd: >
      /usr/bin/llama-server
      --host 127.0.0.1
      --port ${PORT}
      --model /home/jchroback/.local/share/models/Qwen3-8B-ZeroZero-heretic-Q4_K_M.gguf
      --alias qwen-heretic-8b
      --jinja
      --ctx-size 32768
    ttl: 1800
