# llama-swap: dynamic load/unload proxy for llama-server.
# One model in VRAM at a time; a request whose `model` doesn't match the
# resident model triggers a hot-swap (kill + start the matching cmd).
# Listening address is set by the systemd unit's `--listen` flag.
healthCheckTimeout: 240

models:
  qwen3.8-27b:
    cmd: >
      /usr/bin/llama-server
      --host 127.0.0.1
      --port ${PORT}
      --model /home/jchroback/.local/share/models/Qwen3.8-27B-UD-Q3_K_XL.gguf
      --alias qwen3.8-27b
      --jinja
      --ctx-size 16384
    ttl: 1800

  glm-4.7-flash:
    cmd: >
      /usr/bin/llama-server
      --host 127.0.0.1
      --port ${PORT}
      --model /home/jchroback/.local/share/models/GLM-4.7-Flash-UD-Q3_K_XL.gguf
      --alias glm-4.7-flash
      --jinja
      --ctx-size 32768
    ttl: 3600

  devstral-24b:
    cmd: >
      /usr/bin/llama-server
      --host 127.0.0.1
      --port ${PORT}
      --model /home/jchroback/.local/share/models/Devstral-Small-2-24B-Instruct-2512-Q3_K_M.gguf
      --alias devstral-24b
      --jinja
      --ctx-size 24576
    ttl: 1800
